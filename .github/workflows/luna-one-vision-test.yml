name: LUNA one-time vision inference test
on:
  push:
    paths:
      - ".github/workflows/luna-one-vision-test.yml"
jobs:
  one-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send exactly one tiny test image to the configured vision model
        shell: bash
        run: |
          cat > request.json <<'JSON'
          {"mode":"analyze_image","image":"data:image/jpeg;base64,","prompt":"Describe this test image in one short sentence. State the main visible object and its color."}
          JSON
          curl --silent --show-error --max-time 75 \
            --dump-header response-headers.txt \
            --output response-body.txt \
            --write-out "HTTP_STATUS=%{http_code}\n" \
            --request POST \
            --header "Content-Type: text/plain;charset=UTF-8" \
            --data-binary @request.json \
            "https://orange-firefly-6434.madahisaeid200.workers.dev"
          echo "--- RESPONSE HEADERS ---"
          cat response-headers.txt
          echo "--- RESPONSE BODY ---"
          cat response-body.txt
