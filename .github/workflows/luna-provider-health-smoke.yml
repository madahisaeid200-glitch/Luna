name: LUNA AI provider health check

on:
  push:
    branches: ["main"]
    paths:
      - "worker.js"
      - ".github/workflows/luna-provider-health-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed Worker and provider configuration
        shell: bash
        run: |
          set -euo pipefail
          URL="https://orange-firefly-6434.madahisaeid200.workers.dev/"
          for attempt in $(seq 1 24); do
            CODE=$(curl -sS --max-time 15 "$URL" -o /tmp/health.json -w '%{http_code}' || true)
            if [ "$CODE" = "200" ] && python3 -c 'import json; assert "providers" in json.load(open("/tmp/health.json"))' 2>/dev/null; then
              break
            fi
            sleep 5
          done
          python3 - <<'PY'
          import json,sys
          data=json.load(open("/tmp/health.json"))
          print("Worker:",data.get("ok"))
          print("Providers:",json.dumps(data.get("providers",{}),sort_keys=True))
          if not data.get("ok") or "providers" not in data:
              sys.exit("Worker health check failed")
          if not any(data["providers"].get(name) for name in ("mistral", "nvidia", "groq", "gemini", "openrouter")):
              print("No external API keys are configured.")
          else:
              print("At least one external fallback provider key is configured.")
          print("Keyless public fallback wired:", bool(data.get("publicFallbacks", {}).get("murakumo")))
          print("No generation request was sent by this health check.")
          PY
      - name: Probe Murakumo keyless endpoint with a tiny harmless prompt
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS --max-time 90 -H "Content-Type: application/json" \
            -d '{"model":"murakumo/free","messages":[{"role":"user","content":"Reply exactly: LUNA-OK"}],"max_tokens":16,"temperature":0}' \
            "https://api.murakumo.cloud/v1/chat/completions" -o /tmp/murakumo.json -w '%{http_code}' || true)
          echo "Murakumo HTTP: $CODE"
          export CODE
          python3 - <<'PY'
          import json, os
          try:
              data=json.load(open("/tmp/murakumo.json", encoding="utf-8"))
          except Exception as e:
              print("Murakumo returned non-JSON:", str(e))
              raise SystemExit(0)
          if os.environ.get("CODE") == "200":
              choice=(data.get("choices") or [{}])[0]
              print("Murakumo response:", (choice.get("message") or {}).get("content","")[:300])
              print("Model:", data.get("model"))
          else:
              print("Murakumo error:", json.dumps(data, ensure_ascii=False)[:1200])
          PY
