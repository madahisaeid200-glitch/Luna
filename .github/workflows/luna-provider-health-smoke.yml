name: LUNA AI provider health check

on:
  push:
    branches: ["main"]
    paths:
      - "worker.js"
      - ".github/workflows/luna-provider-health-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed Worker and provider configuration
        shell: bash
        run: |
          set -euo pipefail
          URL="https://orange-firefly-6434.madahisaeid200.workers.dev/"
          for attempt in $(seq 1 24); do
            CODE=$(curl -sS --max-time 15 "$URL" -o /tmp/health.json -w '%{http_code}' || true)
            if [ "$CODE" = "200" ] && python3 -c 'import json; d=json.load(open("/tmp/health.json")); assert "providers" in d and d.get("publicFallbacks", {}).get("mishima") and d.get("publicFallbacks", {}).get("murakumoFree") and d.get("publicFallbacks", {}).get("qwen3vl")' 2>/dev/null; then
              break
            fi
            sleep 5
          done
          python3 - <<'PY'
          import json,sys
          data=json.load(open("/tmp/health.json"))
          print("Worker:",data.get("ok"))
          print("Providers:",json.dumps(data.get("providers",{}),sort_keys=True))
          if not data.get("ok") or "providers" not in data or not data.get("publicFallbacks", {}).get("qwen3vl") or not data.get("publicFallbacks", {}).get("murakumoFree"):
              sys.exit("Worker health check failed or keyless Qwen fallback is not deployed")
          print("Keyless Qwen3-VL vision fallback wired:", bool(data.get("publicFallbacks", {}).get("qwen3vl")))
          print("Murakumo free text route wired:", bool(data.get("publicFallbacks", {}).get("murakumoFree")))
          print("Health GET does not consume model quota.")
          PY
      - name: Probe Mishima with low reasoning for a coherent LUNA draft
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS --max-time 90 -H "Content-Type: application/json" \
            -d '{"model":"mishima","messages":[{"role":"system","content":"Write coherent, concise romantic-comedy screenplays. Preserve premise and speaker roles."},{"role":"user","content":"Write a 100-word scene with only LUNA and LEO in their hotel suite. LEO booked their anniversary under the wrong surname. LUNA sees the unfamiliar surname on the welcome card and thinks he booked for another couple. LEO admits he mistyped it. Resolve warmly. Use distinct dialogue and no repeated lines."}],"max_tokens":2048,"temperature":0.3,"reasoning_effort":"low"}' \
            "https://api.murakumo.cloud/v1/chat/completions" -o /tmp/mishima-low.json -w '%{http_code}' || true)
          echo "Mishima low-effort HTTP: $CODE"
          export CODE
          python3 - <<'PY'
          import json, os, sys
          data=json.load(open("/tmp/mishima-low.json", encoding="utf-8"))
          content=((data.get("choices") or [{}])[0].get("message") or {}).get("content","")
          print("Mishima model:", data.get("model"))
          print("Draft preview:", content[:500])
          if os.environ.get("CODE") != "200" or len(content.strip()) < 250:
              print("Mishima low-effort did not return a usable draft.")
              sys.exit(1)
          print("Mishima low-effort screenplay: PASS")
          PY
      - name: Probe Murakumo free text route for a short LUNA draft
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS --max-time 90 -H "Content-Type: application/json" \
            -d '{"model":"murakumo/free","messages":[{"role":"system","content":"Write concise, coherent romantic comedy. Preserve character roles."},{"role":"user","content":"Write a short scene with only LUNA and LEO in their hotel suite. LEO booked their anniversary under the wrong surname. LUNA sees the unfamiliar name on the welcome card, misunderstands, then LEO admits the typo. Resolve warmly."}],"max_tokens":512,"temperature":0.3}' \
            "https://api.murakumo.cloud/v1/chat/completions" -o /tmp/murakumo-free.json -w '%{http_code}' || true)
          echo "Murakumo free HTTP: $CODE"
          export CODE
          python3 - <<'PY'
          import json, os, sys
          data=json.load(open("/tmp/murakumo-free.json", encoding="utf-8"))
          content=((data.get("choices") or [{}])[0].get("message") or {}).get("content","")
          print("Served model:", data.get("model"))
          print("Draft preview:", content[:350])
          if os.environ.get("CODE") != "200" or len(content.strip()) < 100:
              print("Murakumo free route did not return a usable draft.")
              sys.exit(1)
          print("Murakumo free text generation: PASS")
          PY
      - name: Probe keyless Qwen3-VL image understanding (optional degraded-capacity fallback)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS --max-time 50 -H "Content-Type: application/json" \
            -d '{"model":"qwen3-vl-2b-instruct","messages":[{"role":"user","content":[{"type":"text","text":"Describe the main visible color in one word."},{"type":"image_url","image_url":{"url":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAY0lEQVR4nO3PQQ3AIADAQEAhcpCD1IngcVnSU9DOs+/4s7W4AAElFTkSuQmCC"}}]}],"max_tokens":32,"temperature":0}' \
            "https://api.murakumo.cloud/v1/chat/completions" -o /tmp/qwen-vision.json -w '%{http_code}' || true)
          echo "Qwen3-VL vision HTTP: $CODE"
          export CODE
          python3 - <<'PY'
          import json, os, sys
          try:
              data=json.load(open("/tmp/qwen-vision.json", encoding="utf-8"))
          except Exception as e:
              print("Optional Qwen vision probe unavailable:", e)
              sys.exit(0)
          content=((data.get("choices") or [{}])[0].get("message") or {}).get("content","")
          print("Vision preview:", content[:120])
          if os.environ.get("CODE") != "200" or not content.strip():
              print("Optional Qwen vision route is degraded; Cloudflare vision remains fallback.")
              sys.exit(0)
          print("Qwen3-VL image understanding: PASS")
          PY
