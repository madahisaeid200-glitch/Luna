name: LUNA AI provider health check

on:
  push:
    branches: ["main"]
    paths:
      - "worker.js"
      - ".github/workflows/luna-provider-health-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed Worker runtime health and access configuration
        shell: bash
        run: |
          set -euo pipefail
          URL="https://orange-firefly-6434.madahisaeid200.workers.dev/"
          for attempt in $(seq 1 24); do
            CODE=$(curl -sS --max-time 15 "$URL" -o /tmp/health.json -w '%{http_code}' || true)
            if [ "$CODE" = "200" ] && python3 -c 'import json; d=json.load(open("/tmp/health.json")); assert d.get("ok") is True and d.get("service") == "LUNA AI Worker" and d.get("accessConfigured") is True' 2>/dev/null; then
              break
            fi
            sleep 5
          done
          python3 - <<'PY'
          import json,sys
          data=json.load(open("/tmp/health.json"))
          print("Worker healthy:",data.get("ok"))
          print("Service:",data.get("service"))
          print("Runtime access secret configured:",data.get("accessConfigured"))
          print("Workers AI binding available:",data.get("aiBinding"))
          if data.get("ok") is not True or data.get("service") != "LUNA AI Worker" or data.get("accessConfigured") is not True:
              sys.exit("Worker health check failed or runtime access secret is missing")
          print("Runtime health and access configuration verified.")
          print("Health GET does not invoke model inference or consume Workers AI neuron quota.")
          PY
      - name: Confirm health checks do not consume inference capacity
        shell: bash
        run: echo "This workflow performs only a GET health check; it does not invoke model inference."
