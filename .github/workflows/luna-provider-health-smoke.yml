name: LUNA AI provider health check

on:
  push:
    branches: ["main"]
    paths:
      - "worker.js"
      - ".github/workflows/luna-provider-health-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed Worker and provider configuration
        shell: bash
        run: |
          set -euo pipefail
          URL="https://orange-firefly-6434.madahisaeid200.workers.dev/"
          for attempt in $(seq 1 24); do
            CODE=$(curl -sS --max-time 15 "$URL" -o /tmp/health.json -w '%{http_code}' || true)
            if [ "$CODE" = "200" ] && python3 -c 'import json; d=json.load(open("/tmp/health.json")); assert "providers" in d and d.get("publicFallbacks", {}).get("mishima") and d.get("publicFallbacks", {}).get("qwen3vl")' 2>/dev/null; then
              break
            fi
            sleep 5
          done
          python3 - <<'PY'
          import json,sys
          data=json.load(open("/tmp/health.json"))
          print("Worker:",data.get("ok"))
          print("Providers:",json.dumps(data.get("providers",{}),sort_keys=True))
          if not data.get("ok") or "providers" not in data or not data.get("publicFallbacks", {}).get("qwen3vl"):
              sys.exit("Worker health check failed or keyless Qwen fallback is not deployed")
          print("Keyless Qwen3-VL fallback wired:", bool(data.get("publicFallbacks", {}).get("qwen3vl")))
          print("Health GET does not consume model quota.")
          PY
      - name: Probe Mishima with low reasoning for a coherent LUNA draft
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS --max-time 90 -H "Content-Type: application/json" \
            -d '{"model":"mishima","messages":[{"role":"system","content":"Write coherent, concise romantic-comedy screenplays. Preserve premise and speaker roles."},{"role":"user","content":"Write a 100-word scene with only LUNA and LEO in their hotel suite. LEO booked their anniversary under the wrong surname. LUNA sees the unfamiliar surname on the welcome card and thinks he booked for another couple. LEO admits he mistyped it. Resolve warmly. Use distinct dialogue and no repeated lines."}],"max_tokens":2048,"temperature":0.3,"reasoning_effort":"low"}' \
            "https://api.murakumo.cloud/v1/chat/completions" -o /tmp/mishima-low.json -w '%{http_code}' || true)
          echo "Mishima low-effort HTTP: $CODE"
          export CODE
          python3 - <<'PY'
          import json, os, sys
          data=json.load(open("/tmp/mishima-low.json", encoding="utf-8"))
          content=((data.get("choices") or [{}])[0].get("message") or {}).get("content","")
          print("Mishima model:", data.get("model"))
          print("Draft preview:", content[:500])
          if os.environ.get("CODE") != "200" or len(content.strip()) < 250:
              print("Mishima low-effort did not return a usable draft.")
              sys.exit(1)
          print("Mishima low-effort screenplay: PASS")
          PY
      - name: Probe keyless Qwen3-VL for short LUNA text drafting
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS --max-time 60 -H "Content-Type: application/json" \
            -d '{"model":"qwen3-vl-2b-instruct","messages":[{"role":"user","content":"Write a short romantic-comedy scene with only LUNA and LEO in a luxury hotel suite. Keep it under 100 words and return only the scene."}],"max_tokens":512,"temperature":0.3}' \
            "https://api.murakumo.cloud/v1/chat/completions" -o /tmp/qwen-text.json -w '%{http_code}' || true)
          echo "Qwen3-VL text HTTP: $CODE"
          export CODE
          python3 - <<'PY'
          import json, os, sys
          data=json.load(open("/tmp/qwen-text.json", encoding="utf-8"))
          content=((data.get("choices") or [{}])[0].get("message") or {}).get("content","")
          print("Qwen model:", data.get("model"))
          print("Text preview:", content[:260])
          if os.environ.get("CODE") != "200" or len(content.strip()) < 80:
              print("Qwen text generation did not return a usable draft.")
              sys.exit(1)
          print("Keyless Qwen text generation: PASS")
          PY
