name: LUNA public HF Space provider probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/luna-hf-space-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Gradio client
        run: python -m pip install --disable-pip-version-check gradio_client
      - name: Inspect and test public ZeroGPU chat without a token
        env:
          HF_SPACE: sloemo/qwen-3.8-27b-uncensored-chat
        run: |
          python - <<'PY'
          from gradio_client import Client
          import json, time, traceback
          started=time.time()
          print("Connecting to public HF Space without token:", "sloemo/qwen-3.8-27b-uncensored-chat", flush=True)
          client=Client("https://sloemo-qwen-3-8-27b-uncensored-chat.hf.space", verbose=True)
          print("API SCHEMA:", flush=True)
          client.view_api()
          print("SUBMITTING ONE SHORT TEST:", flush=True)
          result=client.predict("Write one short, natural greeting for a romantic comedy screenplay. Reply in one sentence.", [], api_name="/respond")
          print("RESULT TYPE:", type(result).__name__, flush=True)
          print("RESULT:", json.dumps(result, ensure_ascii=False, default=str)[:5000], flush=True)
          print("ELAPSED_SECONDS:", round(time.time()-started,1), flush=True)
          PY
