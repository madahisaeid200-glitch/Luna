name: LUNA browser UI and Worker connection smoke test

on:
  workflow_run:
    workflows: ["Deploy LUNA Studio to GitHub Pages"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test deployed Producer UI and secure Worker health/auth without consuming AI quota
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}, locale:'en-US'});
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            try {
              const response = await page.goto('https://madahisaeid200-glitch.github.io/Luna/producer.html',{waitUntil:'domcontentloaded',timeout:30000});
              if (!response?.ok()) throw new Error('Producer page HTTP failure');
              await page.waitForSelector('#generate', {timeout:10000});
              await page.waitForSelector('#lunaAccessToken', {timeout:10000});
              await page.waitForSelector('#testAiEndpoint', {timeout:10000});
              if (errors.length) throw new Error('Producer JavaScript error: '+errors.join(' | '));
              const endpoint = await page.locator('#aiEndpoint').inputValue();
              if (!endpoint.includes('orange-firefly-6434.madahisaeid200.workers.dev')) throw new Error('Unexpected Worker endpoint: '+endpoint);
              const health = await page.evaluate(async endpoint => {
                const r=await fetch(endpoint,{method:'GET'});
                return {status:r.status,data:await r.json()};
              },endpoint);
              if (health.status!==200 || health.data?.ok!==true || health.data?.service!=='LUNA AI Worker' || health.data?.accessConfigured!==true) {
                throw new Error('Worker health/configuration failed: '+JSON.stringify(health));
              }
              const auth = await page.evaluate(async endpoint => {
                const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer invalid-smoke-test-token'},body:JSON.stringify({mode:'ping'})});
                return {status:r.status,data:await r.json()};
              },endpoint);
              if (auth.status!==401) throw new Error('Expected invalid-token POST to be rejected with HTTP 401; got '+auth.status);
              if (errors.length) throw new Error('Browser JavaScript errors: '+errors.join(' | '));
              console.log('PRODUCER UI: PASS');
              console.log('WORKER GET HEALTH: PASS');
              console.log('RUNTIME ACCESS SECRET CONFIGURED: PASS');
              console.log('INVALID TOKEN REJECTION (HTTP 401): PASS');
              console.log('AI MODEL GENERATION: NOT RUN (preserves free daily AI quota)');
              console.log('PAGE HTTP:',response.status());
              console.log('WORKER:',endpoint);
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE