name: LUNA browser UI and Worker connection smoke test

on:
  workflow_run:
    workflows: ["Deploy LUNA Studio to GitHub Pages"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test deployed Producer UI and Worker GET/POST ping without consuming AI quota
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}, locale:'en-US'});
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            try {
              const response = await page.goto('https://madahisaeid200-glitch.github.io/Luna/producer.html',{waitUntil:'domcontentloaded',timeout:30000});
              if (!response?.ok()) throw new Error('Producer page HTTP failure');
              await page.waitForSelector('#generate', {timeout:10000});
              if (errors.length) throw new Error('Producer JavaScript error: '+errors.join(' | '));
              const endpoint = await page.locator('#aiEndpoint').inputValue();
              if (!endpoint.includes('orange-firefly-6434.madahisaeid200.workers.dev')) throw new Error('Unexpected Worker endpoint: '+endpoint);
              await page.locator('#testAiEndpoint').click();
              await page.waitForFunction(() => /اتصال موفق است: Worker و مسیر POST هر دو پاسخ دادند/.test(document.querySelector('#aiStatus')?.textContent||''), null, {timeout:35000});
              if (errors.length) throw new Error('Browser JavaScript errors: '+errors.join(' | '));
              console.log('PRODUCER UI: PASS');
              console.log('WORKER GET + POST PING: PASS');
              console.log('AI MODEL GENERATION: NOT RUN (preserves free daily AI quota)');
              console.log('PAGE HTTP:',response.status());
              console.log('WORKER:',endpoint);
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE