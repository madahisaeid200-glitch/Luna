name: LUNA Cloudflare diagnostics

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/luna-cloudflare-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luna-cloudflare-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run read-only Cloudflare and live Worker checks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID || '';
          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          const scriptName = 'orange-firefly-6434';
          const workerUrl = 'https://orange-firefly-6434.madahisaeid200.workers.dev';
          const report = {
            app: 'LUNA Cloudflare diagnostics',
            createdAt: new Date().toISOString(),
            accountIdConfigured: Boolean(accountId),
            tokenConfigured: Boolean(token),
            worker: scriptName,
            checks: {}
          };

          async function cfGet(label, route) {
            if (!accountId || !token) {
              report.checks[label] = { skipped: true, reason: 'Required GitHub secret is missing.' };
              return null;
            }
            try {
              const response = await fetch('https://api.cloudflare.com/client/v4' + route, {
                headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
                signal: AbortSignal.timeout(20000)
              });
              const text = await response.text();
              let data;
              try { data = JSON.parse(text); } catch { data = null; }
              report.checks[label] = {
                httpStatus: response.status,
                success: Boolean(data && data.success),
                errors: Array.isArray(data?.errors) ? data.errors.map(e => ({ code: e.code, message: String(e.message || '').slice(0, 220) })) : [],
                resultSummary: Array.isArray(data?.result)
                  ? { count: data.result.length, items: data.result.slice(0, 8).map(x => ({
                      id: x.id, modified_on: x.modified_on, created_on: x.created_on,
                      compatibility_date: x.compatibility_date, usage_model: x.usage_model
                    })) }
                  : data?.result && typeof data.result === 'object'
                    ? Object.fromEntries(['id','created_on','modified_on','compatibility_date','usage_model','observability'].filter(k => data.result[k] !== undefined).map(k => [k, data.result[k]]))
                    : null
              };
              return { response, data };
            } catch (error) {
              report.checks[label] = { error: String(error?.message || error).slice(0, 220) };
              return null;
            }
          }

          async function workerRequest(label, body) {
            const started = Date.now();
            try {
              const response = await fetch(workerUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
                signal: AbortSignal.timeout(115000)
              });
              const raw = await response.text();
              let data;
              try { data = JSON.parse(raw); } catch { data = null; }
              report.checks[label] = {
                httpStatus: response.status,
                elapsedMs: Date.now() - started,
                responseBytes: Buffer.byteLength(raw),
                ok: Boolean(data?.ok),
                model: data?.model || null,
                generationMs: Number.isFinite(data?.generationMs) ? data.generationMs : null,
                audioBase64Chars: typeof data?.audio === 'string' ? data.audio.length : null,
                error: data?.error ? String(data.error).slice(0, 240) : null,
                details: data?.details ? String(data.details).slice(0, 300) : null,
                resultType: data?.resultType || null
              };
            } catch (error) {
              report.checks[label] = {
                elapsedMs: Date.now() - started,
                errorName: error?.name || 'Error',
                error: String(error?.message || error).slice(0, 240)
              };
            }
          }

          (async () => {
            await cfGet('tokenVerification', '/user/tokens/verify');
            await cfGet('workerList', '/accounts/' + encodeURIComponent(accountId) + '/workers/scripts');
            await cfGet('workerSettings', '/accounts/' + encodeURIComponent(accountId) + '/workers/scripts/' + encodeURIComponent(scriptName) + '/script-settings');
            await cfGet('workerDeployments', '/accounts/' + encodeURIComponent(accountId) + '/workers/scripts/' + encodeURIComponent(scriptName) + '/deployments');
            await cfGet('workerVersions', '/accounts/' + encodeURIComponent(accountId) + '/workers/scripts/' + encodeURIComponent(scriptName) + '/versions');
            await workerRequest('workerHealth', null).catch(() => {});
            // A short, non-personal English test phrase checks the actual MeloTTS inference path.
            await workerRequest('meloTtsTest', { mode: 'tts', text: 'Hello from LUNA. This is a short voice test.', lang: 'en' });
            fs.mkdirSync(path.dirname('diagnostics/cloudflare-worker-report.json'), { recursive: true });
            fs.writeFileSync('diagnostics/cloudflare-worker-report.json', JSON.stringify(report, null, 2) + '\n');
          })().catch(error => {
            report.fatalError = String(error?.message || error).slice(0, 240);
            fs.mkdirSync('diagnostics', { recursive: true });
            fs.writeFileSync('diagnostics/cloudflare-worker-report.json', JSON.stringify(report, null, 2) + '\n');
          });
          NODE

      - name: Publish sanitized diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cloudflare-worker-report.json
          if git diff --cached --quiet; then
            echo "Diagnostic report is unchanged."
          else
            git commit -m "Add sanitized Cloudflare Worker diagnostics"
            git push
          fi
