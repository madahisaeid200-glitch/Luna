name: LUNA real browser media pipeline smoke test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "producer.html"
      - "worker.js"
      - ".github/workflows/luna-browser-media-smoke.yml"

permissions:
  contents: read

jobs:
  media-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Wait for the matching GitHub Pages build to be published
        run: |
          set -e
          URL='https://madahisaeid200-glitch.github.io/Luna/producer.html?luna-smoke=all-scenes-artwork-lock-20261102e'
          for attempt in $(seq 1 36); do
            if curl -fsSL "$URL" | grep -q 'all-scenes-artwork-lock-20261102e'; then
              echo 'Matching producer build is live.'
              exit 0
            fi
            echo "Waiting for Pages deployment ($attempt/36)..."
            sleep 10
          done
          echo 'Timed out waiting for the matching Pages build.'
          exit 1
      - name: Exercise production pack, image, vision, TTS and browser video
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs/promises');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:430,height:932}, locale:'en-US'});
            const errors = [];
            const results = [];
            await fs.mkdir('luna-test-output',{recursive:true});
            page.on('pageerror', e => errors.push('PAGE_ERROR: '+e.message));
            page.on('requestfailed', r => errors.push('REQUEST_FAILED: '+r.url()+' '+(r.failure()?.errorText||'')));
            page.on('response', r => { if(r.url().includes('workers.dev')) console.log('WORKER_RESPONSE:',r.status(),r.url()); });
            page.on('dialog', async d => { console.log('DIALOG:',d.message()); await d.accept(); });
            const waitFor = async (fn, ms, label) => {
              try { await page.waitForFunction(fn, null, {timeout:ms}); }
              catch(e) { console.log('FAILED_STAGE:',label); console.log('PAGE_STATUS:',await page.locator('#aiStatus').innerText().catch(()=>'')); console.log('VISUAL_STATUS:',await page.locator('#visualStatus').innerText().catch(()=>'')); console.log('VOICE_STATUS:',await page.locator('#voiceStatus').innerText().catch(()=>'')); throw e; }
            };
            try {
              const pageResponse = await page.goto('https://madahisaeid200-glitch.github.io/Luna/producer.html?luna-smoke=all-scenes-artwork-lock-20261102e',{waitUntil:'domcontentloaded',timeout:30000});
              if(!pageResponse?.ok()) throw new Error('Producer HTTP failure');
              await page.locator('#epTitle').fill('The Five-Star Room Mix-Up');
              await page.locator('#premise').fill('HOOK: Luna enters a breathtaking five-star hotel suite, delighted by Leo’s romantic surprise. SCENE 1: Leo proudly reveals that he booked the suite for their anniversary. Luna notices the welcome card says Mr. and Mrs. Thompson. SCENE 2: Leo sheepishly admits he typed the wrong surname. Luna teases him that they are apparently celebrating another couple’s anniversary. Leo tries to defend himself, then realizes the welcome card is the only thing that is wrong. They stay together in the same suite, laugh, hug and share a sweet kiss. PAYOFF: Leo promises an even better surprise next time. Luna asks whether he will remember their names. Final punchline: Leo says, “Of course. I’ve saved them under ‘My Favourite People’.” Only LUNA and LEO; remain inside the same suite; no reception, hotel staff, extra people, phone or new props. Romantic, playful luxury-comedy tone.');
              await page.locator('#scriptLang').selectOption('en');
              await page.locator('#generate').click();
              await waitFor(()=>{const b=document.querySelector('#makeProductionPack');const t=document.querySelector('#output')?.textContent||'';return !!b&&!b.disabled&&t.length>250&&/LUNA|LEO/i.test(t)&&!/تولید واقعی ناموفق|تولید سناریوی واقعی ناموفق/.test(t);},125000,'script-ready-for-production-pack');
              results.push('SCRIPT: PASS');
              await fs.writeFile('luna-test-output/episode-script.txt',await page.locator('#output').innerText(),'utf8');
              await page.locator('#makeProductionPack').click();
              await waitFor(()=>{const t=document.querySelector('#output')?.textContent||'';return /IMAGE PROMPTS/i.test(t)&&/SHOT LIST/i.test(t)&&!/در حال تبدیل|Building video pack/i.test(document.querySelector('#aiStatus')?.textContent||'');},130000,'production-pack');
              const pack=await page.locator('#output').innerText();
              if(pack.length<1000) throw new Error('Production pack too short: '+pack.length);
              results.push('PRODUCTION_PACK: PASS ('+pack.length+' chars)');
              await fs.writeFile('luna-test-output/production-pack.txt',pack,'utf8');
              await page.locator('#generateSceneImage').click();
              await waitFor(()=>{const img=document.querySelector('#sceneImage');return !!img?.src?.startsWith('data:image/')&&img.complete&&img.naturalWidth>0;},120000,'image-generation');
              const imgSize=await page.locator('#sceneImage').evaluate(img=>({w:img.naturalWidth,h:img.naturalHeight}));
              results.push('IMAGE: PASS ('+imgSize.w+'x'+imgSize.h+')');
              await fs.writeFile('luna-test-output/scene-image.png',Buffer.from((await page.locator('#sceneImage').getAttribute('src')).split(',')[1],'base64'));
              await page.locator('#analyzeSceneImage').click();
              await waitFor(()=>{const t=document.querySelector('#imageAnalysisReport')?.textContent||'';const s=document.querySelector('#imageAnalysisStatus')?.textContent||'';return t.length>40&&!/هنوز گزارشی/.test(t)&&!/در حال کنترل کیفیت|در حال ارسال|در حال آماده‌سازی/.test(s);},135000,'first-scene-visual-qa');
              const firstQa=await page.locator('#imageAnalysisReport').innerText();
              if(!/CAST CHECK:\s*PASS/i.test(firstQa)||!/VISIBLE PEOPLE:\s*2\b/i.test(firstQa)||!/FACES IN ARTWORK:\s*NO/i.test(firstQa)||!(/PHOTOREALISM:\s*(?:[7-9]|10)(?:\.\d+)?/i.test(firstQa))||!(/HANDS\/ANATOMY:\s*(?:[6-9]|10)(?:\.\d+)?/i.test(firstQa))) throw new Error('First-scene visual QA rejected the image: '+firstQa);
              results.push('FIRST_SCENE_VISUAL_QA: PASS');
              await fs.writeFile('luna-test-output/vision-report.txt',firstQa,'utf8');
              await page.locator('#generateMoreScenes').click();
              await waitFor(()=>/3\s*از\s*[۳3]/.test(document.querySelector('#sceneImagesStatus')?.textContent||'')||/هر سه تصویر مستقل داستان آماده‌اند/.test(document.querySelector('#visualStatus')?.textContent||''),480000,'independent-scene-images-and-qa');
              results.push('INDEPENDENT_SCENE_IMAGES_AND_QA: PASS (3 distinct generated images passed visual QA)');
              const syncedVoiceText=await page.locator('#voiceTestText').inputValue();
              if(!syncedVoiceText.includes('LUNA:')||!syncedVoiceText.includes('LEO:')) throw new Error('Voiceover field was not synchronized from the generated screenplay: '+syncedVoiceText);
              results.push('SCREENPLAY_TO_VOICE_SYNC: PASS');
              await page.locator('#generateVoice').click();
              await waitFor(()=>{const a=document.querySelector('#voicePreview'),b=document.querySelector('#makeVoicedVideo');return a?.src?.startsWith('data:audio/')&&a.src.length>1000&&b&&!b.disabled&&!/درخواست صدا|در حال ساخت/.test(document.querySelector('#voiceStatus')?.textContent||'');},165000,'tts-and-voiced-video-ready');
              results.push('TTS: PASS (audio loaded; voiced-video control enabled)');
              await fs.writeFile('luna-test-output/voice.mp3',Buffer.from((await page.locator('#voicePreview').getAttribute('src')).split(',')[1],'base64'));
              await page.locator('#makePreviewVideo').click();
              await waitFor(()=>{const b=document.querySelector('#makePreviewVideo');return !!b&&!b.disabled;},260000,'wan-video-request-finished');
              const wanStatus=await page.locator('#visualStatus').innerText();
              const wanLink=page.locator('#downloadVideoLink');
              if(!(await wanLink.evaluate(a=>a.href.startsWith('blob:')&&a.style.display!=='none'))) throw new Error('Wan 2.2 did not return a video: '+wanStatus);
              results.push('WAN_VIDEO: PASS ('+wanStatus+')');
              const videoBytes=await page.evaluate(async()=>{const r=await fetch(document.querySelector('#downloadVideoLink').href);return (await r.blob()).size;});
              if(videoBytes<10000) throw new Error('Preview video unexpectedly small: '+videoBytes);
              results.push('BROWSER_VIDEO: PASS ('+videoBytes+' bytes)');
              const videoData=await page.evaluate(async()=>Array.from(new Uint8Array(await (await fetch(document.querySelector('#downloadVideoLink').href)).arrayBuffer())));
              await fs.writeFile('luna-test-output/luna-preview.webm',Buffer.from(videoData));
              await page.locator('#makeVoicedVideo').click();
              await waitFor(()=>{const status=document.querySelector('#visualStatus')?.textContent||'';const link=document.querySelector('#downloadVideoLink');return /پیش‌نمایش تدوین‌شده \(Animatic\) ساخته شد/.test(status)&&!!link?.href?.startsWith('blob:')&&link.style.display!=='none';},90000,'voiced-animatic-video');
              const voicedVideo=await page.evaluate(async()=>{const link=document.querySelector('#downloadVideoLink');if(!link?.href?.startsWith('blob:'))throw new Error('Animatic output link is missing');const r=await fetch(link.href);return Array.from(new Uint8Array(await (await r.blob()).arrayBuffer()));});
              const voicedVideoBytes=Buffer.from(voicedVideo);
              if(voicedVideoBytes.length<12000) throw new Error('Voiced video unexpectedly small: '+voicedVideoBytes.length);
              await fs.writeFile('luna-test-output/luna-voiced-episode.webm',voicedVideoBytes);
              results.push('VOICED_VIDEO: PASS ('+voicedVideoBytes.length+' bytes)');
              await page.screenshot({path:'luna-test-output/producer-final.png',fullPage:true});
              console.log(results.join('\n'));
              console.log('MEDIA PIPELINE: PASS');
              if(errors.length) console.log('BROWSER_WARNINGS:',errors.slice(0,15).join('\n'));
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - name: Upload generated LUNA test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luna-episode-test-output
          path: luna-test-output/
          if-no-files-found: warn
          retention-days: 7
