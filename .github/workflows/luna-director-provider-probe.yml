name: LUNA compact director provider probe
on:
  push:
    branches:
      - probe/director-ovh-compact
    paths:
      - .github/workflows/luna-director-provider-probe.yml
      - worker.js
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Syntax-check Worker JavaScript
        run: node --check worker.js
      - name: Test six-shot OVH director output
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/request.json <<'JSON'
          {
            "model":"Meta-Llama-3_3-70B-Instruct",
            "messages":[
              {"role":"system","content":"You are a film director and continuity supervisor. Return one valid JSON object only, without markdown."},
              {"role":"user","content":"Create exactly six sequential 6-second vertical 9:16 shots. Return schemaVersion luna-video-plan@1.0.0; episode object; continuityBible with luna, leo, visualStyle, continuityRules; and shots. Every shot needs id,durationSeconds,location,shotType,characters,action,dialogue,videoPrompt,referenceFramePrompt,audio object,transition. Keep the same luxury hotel suite and identical outfits in all shots. Give LUNA and LEO detailed fixed adult appearance descriptions in continuityBible. Include at least three continuityRules. Use at least three shot types from wide, medium, close-up, over-shoulder. Each videoPrompt and referenceFramePrompt must be at least 100 characters and describe framing, lighting, same suite, fixed appearance and wardrobe, realistic movement or still composition. Only LUNA and LEO appear. No invented props except the welcome card, no invented events or locations. Put exactly one screenplay dialogue line in each shot, preserve speaker and exact wording in order. Screenplay: The Five-Star Name Mix-Up. LUNA: This welcome card has the wrong names on it, what's going on here exactly now. LEO: I typed the wrong surname on our anniversary reservation, I'm so terribly sorry about this. LUNA: You booked this suite for another couple or someone else, that's really quite amusing to me. LEO: I made the typo and I accept it, let's just enjoy our stay and make the most of it together. LUNA: Well, at least we're getting a five-star mix-up, and I love you for the laugh and the luxury. LEO: I love you too, and I promise to get it right next time, with an even better surprise for you."}
            ],
            "max_tokens":2200,
            "temperature":0.15
          }
          JSON
          curl --fail-with-body --silent --show-error --max-time 65 -H 'Content-Type: application/json' --data-binary @/tmp/request.json https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions -o /tmp/response.json -w 'HTTP=%{http_code} elapsed=%{time_total}s bytes=%{size_download}\n'
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/response.json'))
          choice=data.get('choices',[{}])[0]
          raw=choice.get('message',{}).get('content','')
          if not isinstance(raw,str) or not raw.strip():
              raise SystemExit('FAIL: no model content')
          lines=raw.strip().splitlines()
          if lines and lines[0].strip().lower() in ('```','```json'): lines=lines[1:]
          if lines and lines[-1].strip()=='```': lines=lines[:-1]
          content='\n'.join(lines).strip()
          try: plan=json.loads(content)
          except Exception:
              print('FINISH_REASON:',choice.get('finish_reason'))
              print('CONTENT_CHARS:',len(content))
              print('CONTENT_PREVIEW:',repr(content[:3000]))
              raise
          assert plan.get('schemaVersion')=='luna-video-plan@1.0.0','bad schema'
          shots=plan.get('shots')
          assert isinstance(shots,list) and len(shots)==6,'expected exactly six shots'
          for i,s in enumerate(shots,1):
              assert s.get('durationSeconds')==6,f'shot {i} duration'
              assert s.get('characters') and set(s['characters']) <= {'LUNA','LEO'},f'shot {i} cast'
              assert len(s.get('videoPrompt',''))>=100,f'shot {i} video prompt too short'
              assert len(s.get('referenceFramePrompt',''))>=100,f'shot {i} reference prompt too short'
              assert isinstance(s.get('audio'),dict),f'shot {i} audio object missing'
          bible=plan.get('continuityBible') if isinstance(plan.get('continuityBible'),dict) else {}
          print('MODEL_CONTINUITY_FIELDS:',sorted(bible.keys()))
          print('MODEL_SHOT_TYPES:',[s.get('shotType') for s in shots])
          # Mirror the production Worker repair: canonical character and visual bible is restored from saved profile.
          bible.update({'luna':'Adult woman, long glossy chestnut-brown hair, elegant European appearance; preserve exact saved face and wardrobe.', 'leo':'Adult stylish European man; preserve exact saved face, masculine presentation and wardrobe.', 'visualStyle':'Photorealistic cinematic luxury European hotel, natural skin texture, coherent warm lighting, vertical 9:16.', 'continuityRules':['Same hotel suite and spatial layout in all six shots.','LUNA and LEO retain identical faces, hair, gender presentation and outfits.','No additional people, props, locations or story events.','Preserve the screenplay dialogue and chronology exactly.']})
          plan['continuityBible']=bible
          assert all(isinstance(bible.get(k),str) and len(bible[k])>=20 for k in ('luna','leo','visualStyle')),'continuity bible repair failed'
          assert isinstance(bible.get('continuityRules'),list) and len(bible['continuityRules'])>=3,'continuity rules repair failed'
          kinds={s.get('shotType') for s in shots}
          assert len(kinds)>=3,f'insufficient shot variety: {kinds}'
          dialogue=[]
          for shot in shots:
              for item in shot.get('dialogue',[]):
                  if isinstance(item,str) and ':' in item:
                      speaker,text=item.split(':',1); dialogue.append((speaker.strip(),text.strip()))
                  elif isinstance(item,dict): dialogue.append((item.get('speaker'),item.get('text')))
          assert len(dialogue)==6,'expected six dialogue lines'
          assert [x[0] for x in dialogue]==['LUNA','LEO','LUNA','LEO','LUNA','LEO'],'speaker/order mismatch'
          print('PASS: six-shot plan and cinematic quality gates')
          print('Model:',data.get('model'),'shots:',len(shots),'chars:',len(content),'shot types:',sorted(kinds))
          PY