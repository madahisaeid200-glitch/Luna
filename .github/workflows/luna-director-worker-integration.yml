name: LUNA branch Worker director integration
on:
  push:
    branches:
      - probe/director-ovh-compact
    paths:
      - worker.js
      - producer.html
      - scripts/test-luna-director-ui.cjs
      - .github/workflows/luna-director-worker-integration.yml
  workflow_dispatch:

concurrency:
  group: luna-director-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  director-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler and Playwright
        run: |
          npm install --no-save wrangler playwright
          npx playwright install --with-deps chromium
      - name: Check Producer inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          html=open('producer.html',encoding='utf-8').read()
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script>',html,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts found')
          for index,script in enumerate(scripts):
              path=f'/tmp/producer-inline-{index}.js'
              open(path,'w',encoding='utf-8').write(script)
              print('Checking',path)
              import subprocess
              subprocess.run(['node','--check',path],check=True)
          PY
      - name: Start local Producer static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/luna-http.log 2>&1 &
          echo $! > /tmp/luna-http.pid
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/producer.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/luna-http.log
          exit 1
      - name: Test Producer Director-to-media UI integration
        run: node scripts/test-luna-director-ui.cjs
      - name: Start the exact branch Worker locally
        run: |
          npx wrangler dev worker.js --local --ip 127.0.0.1 --port 8787 --log-level warn > /tmp/luna-wrangler.log 2>&1 &
          echo $! > /tmp/luna-wrangler.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/ >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/luna-wrangler.log
          exit 1
      - name: Exercise real Director route through the branch Worker
        run: |
          cat > /tmp/request.json <<'JSON'
          {
            "mode":"director",
            "title":"The Five-Star Name Mix-Up",
            "duration":"short",
            "script":"The Five-Star Name Mix-Up\nLUNA: This welcome card has the wrong names on it, what's going on here exactly now.\nLEO: I typed the wrong surname on our anniversary reservation, I'm so terribly sorry about this.\nLUNA: You booked this suite for another couple or someone else, that's really quite amusing to me.\nLEO: I made the typo and I accept it, let's just enjoy our stay and make the most of it together.\nLUNA: Well, at least we're getting a five-star mix-up, and I love you for the laugh and the luxury.\nLEO: I love you too, and I promise to get it right next time, with an even better surprise for you."
          }
          JSON
          curl --fail-with-body --silent --show-error --max-time 210 -H 'Content-Type: application/json' --data-binary @/tmp/request.json http://127.0.0.1:8787/ -o /tmp/worker-response.json -w 'WORKER_HTTP=%{http_code} elapsed=%{time_total}s bytes=%{size_download}\n'
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/worker-response.json'))
          assert data.get('ok') is True, data.get('error') or 'Worker did not report success'
          assert data.get('mode')=='director', 'wrong mode'
          assert data.get('provider')=='ovhcloud', f"expected live OVH provider, got {data.get('provider')}"
          plan=data.get('plan') or {}
          assert plan.get('schemaVersion')=='luna-video-plan@1.0.0', 'schema mismatch'
          shots=plan.get('shots')
          assert isinstance(shots,list) and len(shots)==6, 'expected six shots'
          expected=[
            ('LUNA',"This welcome card has the wrong names on it, what's going on here exactly now."),
            ('LEO',"I typed the wrong surname on our anniversary reservation, I'm so terribly sorry about this."),
            ('LUNA',"You booked this suite for another couple or someone else, that's really quite amusing to me."),
            ('LEO',"I made the typo and I accept it, let's just enjoy our stay and make the most of it together."),
            ('LUNA',"Well, at least we're getting a five-star mix-up, and I love you for the laugh and the luxury."),
            ('LEO',"I love you too, and I promise to get it right next time, with an even better surprise for you.")
          ]
          actual=[]
          kinds=set()
          for index,shot in enumerate(shots):
            assert shot.get('durationSeconds')>=4, f"shot {index+1} duration"
            assert shot.get('characters') and set(shot['characters']) <= {'LUNA','LEO'}, f"shot {index+1} cast"
            assert len(shot.get('videoPrompt',''))>=100, f"shot {index+1} video prompt"
            assert len(shot.get('referenceFramePrompt',''))>=100, f"shot {index+1} reference prompt"
            assert isinstance(shot.get('audio'),dict), f"shot {index+1} audio"
            kinds.add(shot.get('shotType'))
            for line in shot.get('dialogue',[]):
              actual.append((line.get('speaker'),line.get('text')))
          assert actual==expected, f'dialogue mismatch: {actual!r}'
          assert len(kinds)>=3, f'insufficient framing variety: {kinds}'
          bible=plan.get('continuityBible') or {}
          assert all(isinstance(bible.get(k),str) and len(bible[k])>=20 for k in ('luna','leo','visualStyle')), 'continuity bible missing'
          assert len(bible.get('continuityRules',[]))>=3, 'continuity rules missing'
          print('PASS: branch Worker → live OVH Director → normalized six-shot plan')
          print('PROVIDER:',data.get('provider'),'MODEL:',data.get('model'))
          print('SHOT_TYPES:',sorted(kinds),'DIALOGUE_LINES:',len(actual))
          print('DURATION_SECONDS:',plan.get('episode',{}).get('targetDurationSeconds'))
          PY
      - name: One real image and one real Wan video smoke test
        id: media-smoke
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, urllib.error
          base='http://127.0.0.1:8787/'
          report={'image':None,'wan_health':None,'video':None}
          def post(payload, timeout):
            req=urllib.request.Request(base,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(req,timeout=timeout) as r:
              return r.status,r.headers, r.read()
          try:
            print('Checking public Wan Space availability without starting GPU generation...')
            status,headers,raw=post({'mode':'video_health'},35)
            health=json.loads(raw)
            report['wan_health']={'http':status,'ok':health.get('ok'),'engine':health.get('engine'),'endpointAvailable':health.get('endpointAvailable')}
            print('WAN_HEALTH:',json.dumps(report['wan_health']))
            if not health.get('ok'): raise RuntimeError('Wan public Space is not ready; no video job was submitted.')
            prompt=('MASTER CAST CONSTRAINT: exactly ONE adult woman and exactly ONE adult man, visibly different genders, a romantic couple photographed INSIDE A MODERN FIVE-STAR HOTEL BEDROOM SUITE. '
                    'The setting must visibly contain a large king-size bed with a padded upholstered headboard, a beige luxury sofa, a marble coffee table, warm bedside lamps and floor-to-ceiling windows with a modern city skyline. This is a hotel room, absolutely not a church, chapel, cathedral, hall or religious building. '
                    'WOMAN: 27-year-old elegant woman, very long waist-length warm chestnut-brown hair worn loose over both shoulders, hazel eyes, feminine facial features, champagne-silver silk evening gown. Hair must be long and chestnut brown, not black and not a bob. '
                    'MAN: unmistakably adult MALE, 29-year-old European man, short neatly styled dark-brown hair, clearly masculine angular jaw, visible subtle beard stubble, broad masculine shoulders and athletic natural male body, perfectly tailored BLACK tuxedo jacket, white shirt and black trousers. '
                    'The man must look unmistakably male, NOT a woman, NOT feminine, NOT wearing a dress. The woman must look unmistakably female. Exactly two people total: one woman and one man. No other people, no portraits, no human figures in mirrors or artwork. '
                    'Photorealistic live-action luxury hotel editorial film still, realistic skin pores, natural anatomy, warm practical hotel lighting, contemporary neutral interior, cinematic vertical 9:16 composition. '
                    'NEGATIVE: two women, two girls, female duo, woman in tuxedo, man in gown, feminine male, long-haired man, short-haired woman, black-haired woman, bob haircut, third person, church, cathedral, chapel, stained glass, pews, altar, painting, text, logo, collage.')
            print('Trying the legacy no-key Pollinations image route first...')
            prompt=('Exactly one adult woman and one adult man, visibly different genders, standing together in a modern five-star hotel bedroom suite. The woman has very long loose chestnut-brown hair, hazel eyes and wears a champagne silk dress. The man is unmistakably male with short dark-brown hair, masculine jaw, visible beard stubble, broad shoulders and a black tailored tuxedo. The modern hotel room must show a king-size bed, upholstered headboard, beige sofa, marble table, bedside lamps and floor-to-ceiling windows with city skyline. Not a church, cathedral, chapel or religious building. Photorealistic cinematic live-action, natural skin, vertical 9:16. NEGATIVE: two women, two men, gender swap, church, cathedral, chapel, stained glass, pews, altar, third person, portraits, text, watermark.')
            os.makedirs('media-smoke',exist_ok=True)
            image_bytes=None
            mime='image/jpeg'
            provider='pollinations-legacy-anonymous'
            pollinations_error=''
            try:
              from urllib.parse import quote
              image_url='https://image.pollinations.ai/prompt/'+quote(prompt,safe='')+'?width=512&height=768&seed=20261103&nologo=true'
              req=urllib.request.Request(image_url,headers={'Accept':'image/jpeg,image/png,image/webp','User-Agent':'LUNA-Media-Smoke/1.0'})
              with urllib.request.urlopen(req,timeout=150) as response:
                mime=response.headers.get('Content-Type','image/jpeg').split(';')[0]
                image_bytes=response.read()
                if response.status!=200 or not mime.startswith('image/') or len(image_bytes)<50000:
                  raise RuntimeError('Unexpected Pollinations response: '+str(response.status)+' '+mime+' '+str(len(image_bytes))+' bytes')
            except Exception as error:
              pollinations_error=str(error)[:400]
              print('POLLINATIONS_UNAVAILABLE:',pollinations_error)
              print('Falling back to the Worker image route...')
              status,headers,raw=post({'mode':'image','script':prompt},210)
              data=json.loads(raw)
              encoded=data.get('image')
              if status!=200 or not encoded: raise RuntimeError('Both Pollinations and Worker image routes failed: '+str(data.get('error') or status)+' '+str(data.get('details') or '')[:300])
              mime=data.get('mimeType') or 'image/jpeg'
              image_bytes=base64.b64decode(encoded)
              provider=data.get('provider') or 'worker-fallback'
              report['image_fallback']={'provider':provider,'model':data.get('model'),'pollinationsError':pollinations_error}
            ext='png' if 'png' in mime else 'webp' if 'webp' in mime else 'jpg'
            image_path='media-smoke/luna-smoke-image.'+ext
            with open(image_path,'wb') as out: out.write(image_bytes)
            image='data:'+mime+';base64,'+base64.b64encode(image_bytes).decode()
            report['image']={'http':200,'provider':provider,'contentType':mime,'bytes':os.path.getsize(image_path),'path':image_path,'pollinationsFallbackError':pollinations_error or None}
            print('REAL_IMAGE:',json.dumps(report['image']))

            print('Submitting exactly one short real Wan 2.2 I2V generation...')
            video_payload={'mode':'video','image':'data:'+mime+';base64,'+image,'prompt':'Animate only this exact reference frame for 1.5 seconds. Preserve the same two adult people, faces, clothing and hotel suite. Subtle natural breathing, a gentle glance toward each other, minimal smooth camera push-in. No cuts, no morphing, no added people or objects. Photorealistic live action.','durationSeconds':1.5,'steps':2}
            status,headers,video=post(video_payload,230)
            ctype=headers.get('Content-Type','')
            if status!=200 or not ctype.lower().startswith('video/'): raise RuntimeError('Wan did not return a video: HTTP '+str(status)+' '+ctype+' '+video[:350].decode(errors='replace'))
            ext='mp4' if 'mp4' in ctype else 'webm'
            video_path='media-smoke/luna-smoke-video.'+ext
            with open(video_path,'wb') as out: out.write(video)
            if os.path.getsize(video_path)<50000: raise RuntimeError('Wan video file was unexpectedly small.')
            report['video']={'http':status,'contentType':ctype,'bytes':os.path.getsize(video_path),'path':video_path,'engine':'Wan2.2-14B-Fast-I2V'}
            print('REAL_VIDEO:',json.dumps(report['video']))
            report['status']='passed'
          except Exception as error:
            report['status']='failed'
            report['error']=str(error)[:1200]
            print('MEDIA_SMOKE_FAILED:',report['error'])
            raise
          finally:
            os.makedirs('media-smoke',exist_ok=True)
            with open('media-smoke/report.json','w') as out: json.dump(report,out,indent=2)
          PY
      - name: Upload real media smoke-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luna-real-media-smoke-hotel-suite-retest
          path: media-smoke/
          if-no-files-found: warn
      - name: Stop local Worker
        if: always()
        run: |
          if [ -f /tmp/luna-wrangler.pid ]; then kill "$(cat /tmp/luna-wrangler.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/luna-http.pid ]; then kill "$(cat /tmp/luna-http.pid)" 2>/dev/null || true; fi
