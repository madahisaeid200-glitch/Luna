name: LUNA branch Worker director integration
on:
  push:
    branches:
      - probe/director-ovh-compact
    paths:
      - worker.js
      - producer.html
      - scripts/test-luna-director-ui.cjs
      - .github/workflows/luna-director-worker-integration.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  director-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler and Playwright
        run: |
          npm install --no-save wrangler playwright
          npx playwright install --with-deps chromium
      - name: Check Producer inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          html=open('producer.html',encoding='utf-8').read()
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script>',html,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts found')
          for index,script in enumerate(scripts):
              path=f'/tmp/producer-inline-{index}.js'
              open(path,'w',encoding='utf-8').write(script)
              print('Checking',path)
              import subprocess
              subprocess.run(['node','--check',path],check=True)
          PY
      - name: Start local Producer static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/luna-http.log 2>&1 &
          echo $! > /tmp/luna-http.pid
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/producer.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/luna-http.log
          exit 1
      - name: Test Producer Director-to-media UI integration
        run: node scripts/test-luna-director-ui.cjs
      - name: Start the exact branch Worker locally
        run: |
          npx wrangler dev worker.js --local --ip 127.0.0.1 --port 8787 --log-level warn > /tmp/luna-wrangler.log 2>&1 &
          echo $! > /tmp/luna-wrangler.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/ >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/luna-wrangler.log
          exit 1
      - name: Exercise real Director route through the branch Worker
        run: |
          cat > /tmp/request.json <<'JSON'
          {
            "mode":"director",
            "title":"The Five-Star Name Mix-Up",
            "duration":"short",
            "script":"The Five-Star Name Mix-Up\nLUNA: This welcome card has the wrong names on it, what's going on here exactly now.\nLEO: I typed the wrong surname on our anniversary reservation, I'm so terribly sorry about this.\nLUNA: You booked this suite for another couple or someone else, that's really quite amusing to me.\nLEO: I made the typo and I accept it, let's just enjoy our stay and make the most of it together.\nLUNA: Well, at least we're getting a five-star mix-up, and I love you for the laugh and the luxury.\nLEO: I love you too, and I promise to get it right next time, with an even better surprise for you."
          }
          JSON
          curl --fail-with-body --silent --show-error --max-time 210 -H 'Content-Type: application/json' --data-binary @/tmp/request.json http://127.0.0.1:8787/ -o /tmp/worker-response.json -w 'WORKER_HTTP=%{http_code} elapsed=%{time_total}s bytes=%{size_download}\n'
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/worker-response.json'))
          assert data.get('ok') is True, data.get('error') or 'Worker did not report success'
          assert data.get('mode')=='director', 'wrong mode'
          assert data.get('provider')=='ovhcloud', f"expected live OVH provider, got {data.get('provider')}"
          plan=data.get('plan') or {}
          assert plan.get('schemaVersion')=='luna-video-plan@1.0.0', 'schema mismatch'
          shots=plan.get('shots')
          assert isinstance(shots,list) and len(shots)==6, 'expected six shots'
          expected=[
            ('LUNA',"This welcome card has the wrong names on it, what's going on here exactly now."),
            ('LEO',"I typed the wrong surname on our anniversary reservation, I'm so terribly sorry about this."),
            ('LUNA',"You booked this suite for another couple or someone else, that's really quite amusing to me."),
            ('LEO',"I made the typo and I accept it, let's just enjoy our stay and make the most of it together."),
            ('LUNA',"Well, at least we're getting a five-star mix-up, and I love you for the laugh and the luxury."),
            ('LEO',"I love you too, and I promise to get it right next time, with an even better surprise for you.")
          ]
          actual=[]
          kinds=set()
          for index,shot in enumerate(shots):
            assert shot.get('durationSeconds')>=4, f"shot {index+1} duration"
            assert shot.get('characters') and set(shot['characters']) <= {'LUNA','LEO'}, f"shot {index+1} cast"
            assert len(shot.get('videoPrompt',''))>=100, f"shot {index+1} video prompt"
            assert len(shot.get('referenceFramePrompt',''))>=100, f"shot {index+1} reference prompt"
            assert isinstance(shot.get('audio'),dict), f"shot {index+1} audio"
            kinds.add(shot.get('shotType'))
            for line in shot.get('dialogue',[]):
              actual.append((line.get('speaker'),line.get('text')))
          assert actual==expected, f'dialogue mismatch: {actual!r}'
          assert len(kinds)>=3, f'insufficient framing variety: {kinds}'
          bible=plan.get('continuityBible') or {}
          assert all(isinstance(bible.get(k),str) and len(bible[k])>=20 for k in ('luna','leo','visualStyle')), 'continuity bible missing'
          assert len(bible.get('continuityRules',[]))>=3, 'continuity rules missing'
          print('PASS: branch Worker → live OVH Director → normalized six-shot plan')
          print('PROVIDER:',data.get('provider'),'MODEL:',data.get('model'))
          print('SHOT_TYPES:',sorted(kinds),'DIALOGUE_LINES:',len(actual))
          print('DURATION_SECONDS:',plan.get('episode',{}).get('targetDurationSeconds'))
          PY
      - name: One real Worker image smoke test
        id: media-smoke
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[image-smoke]')
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          base='http://127.0.0.1:8787/'
          report={'image':None}
          prompt=('Exactly one adult woman and one adult man, visibly different genders, standing together in a modern five-star hotel bedroom suite. '
                  'The setting must clearly show a king-size bed with an upholstered headboard, beige luxury sofa, marble coffee table, warm bedside lamps and floor-to-ceiling windows with a modern city skyline. This is a hotel room, not a church, chapel, cathedral or religious building. '
                  'WOMAN: elegant 27-year-old European woman with very long loose chestnut-brown hair, hazel eyes and a champagne-silver silk evening gown. '
                  'MAN: unmistakably adult male European man, short dark-brown hair, masculine angular jaw, subtle beard stubble, broad shoulders, black tailored tuxedo jacket, white shirt and black trousers. '
                  'Exactly two people total. Preserve clearly different feminine and masculine gender presentation. Photorealistic live-action luxury hotel editorial, natural skin texture, warm practical lighting, vertical 9:16. '
                  'NEGATIVE: two women, two men, gender swap, woman in tuxedo, man in gown, church, cathedral, chapel, stained glass, pews, altar, third person, portraits, text, watermark, collage.')
          req=urllib.request.Request(base,data=json.dumps({'mode':'image','script':prompt}).encode(),headers={'Content-Type':'application/json'},method='POST')
          try:
            with urllib.request.urlopen(req,timeout=210) as response:
              status=response.status
              raw=response.read()
          except urllib.error.HTTPError as error:
            status=error.code
            raw=error.read()
          try:
            data=json.loads(raw)
          except Exception:
            data={}
          encoded=data.get('image')
          if status!=200 or not encoded:
            report.update({'status':'failed','http':status,'error':data.get('error'),'details':data.get('details') or data.get('fallbackReason')})
            raise RuntimeError('Worker image route failed: HTTP '+str(status)+' '+str(report.get('error'))+' '+str(report.get('details') or '')[:500])
          mime=data.get('mimeType') or 'image/jpeg'
          ext='png' if 'png' in mime else 'webp' if 'webp' in mime else 'jpg'
          os.makedirs('media-smoke',exist_ok=True)
          image_path='media-smoke/luna-worker-image.'+ext
          image_bytes=base64.b64decode(encoded)
          with open(image_path,'wb') as out: out.write(image_bytes)
          report={'status':'passed','http':status,'provider':data.get('provider'),'model':data.get('model'),'mimeType':mime,'bytes':len(image_bytes),'fallbackUsed':data.get('fallbackUsed'),'fallbackReason':data.get('fallbackReason'),'path':image_path}
          print('REAL_WORKER_IMAGE:',json.dumps(report))
          with open('media-smoke/report.json','w') as out: json.dump(report,out,indent=2)
          PY
      - name: One real Wan 2.2 video smoke test
        id: wan-smoke
        if: contains(github.event.head_commit.message, '[wan-smoke]') && steps.media-smoke.outcome == 'success'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error, time
          image_path=next(('media-smoke/luna-worker-image.'+ext for ext in ('jpg','png','webp') if os.path.exists('media-smoke/luna-worker-image.'+ext)),None)
          if not image_path: raise SystemExit('No successful real reference image is available for Wan smoke test.')
          with open(image_path,'rb') as f: image_bytes=f.read()
          mime='image/png' if image_path.endswith('.png') else 'image/webp' if image_path.endswith('.webp') else 'image/jpeg'
          data_url='data:'+mime+';base64,'+base64.b64encode(image_bytes).decode()
          payload={'mode':'video','image':data_url,'prompt':'One continuous photorealistic live-action shot in the exact same luxury hotel suite. Preserve the two adults exactly as visible in the reference image, their faces, gender presentation, hair and wardrobe. Subtle natural movement, a gentle camera push-in, realistic fabric and warm practical lighting. No cuts, no morphing, no new people, no text or logos.','durationSeconds':2.5,'steps':2}
          req=urllib.request.Request('http://127.0.0.1:8787/',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
          started=time.time()
          try:
            with urllib.request.urlopen(req,timeout=225) as response:
              status=response.status
              content_type=response.headers.get('Content-Type','')
              video=response.read()
          except urllib.error.HTTPError as error:
            status=error.code
            content_type=error.headers.get('Content-Type','')
            video=error.read()
          if status!=200 or 'video' not in content_type.lower() or len(video)<50000:
            try: detail=json.loads(video).get('details') or json.loads(video).get('error')
            except Exception: detail=video[:600].decode('utf-8','replace')
            report={'status':'failed','http':status,'contentType':content_type,'bytes':len(video),'details':detail,'elapsedSeconds':round(time.time()-started,1)}
            os.makedirs('media-smoke',exist_ok=True)
            with open('media-smoke/wan-report.json','w') as f: json.dump(report,f,indent=2)
            raise RuntimeError('Real Wan smoke failed: '+json.dumps(report))
          ext='mp4' if 'mp4' in content_type.lower() else 'webm'
          path='media-smoke/luna-wan-smoke.'+ext
          with open(path,'wb') as f: f.write(video)
          report={'status':'passed','http':status,'engine':'Wan2.2-14B-Fast-I2V','contentType':content_type,'bytes':len(video),'elapsedSeconds':round(time.time()-started,1),'path':path,'referenceImage':image_path}
          with open('media-smoke/wan-report.json','w') as f: json.dump(report,f,indent=2)
          print('REAL_WAN_VIDEO:',json.dumps(report))
          PY
      - name: Upload real media smoke-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luna-real-media-smoke-pollinations-probe
          path: media-smoke/
          if-no-files-found: warn
      - name: Stop local Worker
        if: always()
        run: |
          if [ -f /tmp/luna-wrangler.pid ]; then kill "$(cat /tmp/luna-wrangler.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/luna-http.pid ]; then kill "$(cat /tmp/luna-http.pid)" 2>/dev/null || true; fi
