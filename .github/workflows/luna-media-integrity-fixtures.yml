name: LUNA media container integrity fixtures

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Generate local MP4 and WebM fixtures and validate full decode
        run: bash tests/media-integrity/run-fixtures.sh
