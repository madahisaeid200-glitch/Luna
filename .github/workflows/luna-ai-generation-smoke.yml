name: LUNA real AI script generation smoke test

on:
  workflow_run:
    workflows: ["Deploy LUNA AI Worker"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luna-ai-generation-smoke
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test one real short script generation (not just Worker ping)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://orange-firefly-6434.madahisaeid200.workers.dev/"
          ORIGIN="https://madahisaeid200-glitch.github.io"
          cat > /tmp/request.json <<'JSON'
          {
            "title": "The Five-Star Name Mix-Up",
            "premise": "Luna and Leo are already inside one luxury hotel suite. Leo proudly reveals that he booked the suite for their romantic anniversary, but he accidentally used the wrong surname. Luna notices the welcome card has another couple's name. They stay in the suite, tease each other, and resolve the mix-up with a sweet joke. Do not add other people or locations.",
            "duration": "short",
            "tone": "romcom",
            "language": "en",
            "characterProfile": {
              "lunaName": "LUNA",
              "lunaLook": "Adult elegant European woman, long glossy chestnut-brown hair, hazel eyes, realistic natural features.",
              "lunaPersonality": "Warm, witty, romantic and playful.",
              "leoName": "LEO",
              "leoLook": "Adult elegant European man, neatly styled dark-brown hair, warm brown eyes, subtle stubble.",
              "leoPersonality": "Charming, affectionate and adorably chaotic.",
              "style": "Photorealistic luxury European lifestyle, natural cinematic lighting, realistic skin texture, vertical 9:16."
            }
          }
          JSON
          echo "Sending one real generation request to the deployed Worker..."
          curl --silent --show-error --max-time 150 \
            -H "Origin: $ORIGIN" \
            -H "Content-Type: text/plain;charset=UTF-8" \
            --data-binary @/tmp/request.json \
            "$URL" -o /tmp/response.json -w 'HTTP %{http_code}; total_seconds=%{time_total}; bytes=%{size_download}\n'
          python3 - <<'PY'
          import json, sys
          with open("/tmp/response.json", encoding="utf-8") as f:
              result = json.load(f)
          script = result.get("script")
          print("Provider:", result.get("provider"))
          print("Model:", result.get("model"))
          print("Fallback used:", result.get("fallbackUsed"))
          if isinstance(script, str) and len(script.strip()) >= 300:
              text = script.lower()
              word_count = len(text.split())
              if word_count < 80 or word_count > 180:
                  print(f"FAIL: screenplay length outside 80-180 words ({word_count}).")
                  print(script[:2500])
                  sys.exit(1)
              checks = {
                  "LUNA and LEO are present": "luna" in text and "leo" in text,
                  "wrong surname is acknowledged": any(x in text for x in ("wrong surname", "mistyped", "typed the wrong")),
                  "misunderstanding is about another couple": any(x in text for x in ("another couple", "wrong couple", "other couple", "someone else")),
                  "next-episode tease is present": bool(__import__("re").search(r"next[- ]episode|next time", text)),
                  "tease promises a romantic surprise": any(x in text for x in ("surprise", "romantic", "anniversary", "date", "gift", "plan")),
                  "no contradiction denying the typo": not any(x in text for x in ("not a typo", "not a mistake", "not a mix-up")),
                  "no unrequested props or hotel staff": not any(x in text for x in ("hotel manager", "receptionist", "front desk", "phone", "staff")),
                  "no wrong-suite plot drift": not any(x in text for x in ("wrong suite", "checking out", "new name"))
              }
              for label, passed in checks.items():
                  print(("PASS" if passed else "FAIL") + ": " + label)
              if not all(checks.values()):
                  print("FAIL: Screenplay did not pass LUNA story-continuity checks.")
                  print(script[:2500])
                  sys.exit(1)
              print("Model:", result.get("model"))
              print("Provider:", result.get("provider"))
              print("Fallback used:", result.get("fallbackUsed"))
              if result.get("provider") == "local-template" or result.get("fallbackUsed") is True:
                  print("FAIL: valid screenplay came from a deterministic fallback, not a live AI provider.")
                  print("Provider failure details:", result.get("fallbackReason") or result.get("details"))
                  sys.exit(1)
              print("PASS: live AI provider generated a screenplay and it passed continuity checks.")
              print("Script characters:", len(script))
              print("Preview:", script[:700].replace("\\n", " "))
              sys.exit(0)
          print("FAIL: The Worker did not return a valid AI screenplay.")
          print(json.dumps(result, ensure_ascii=False, indent=2)[:6000])
          sys.exit(1)
          PY

      - name: Test director shot-plan generation from the accepted screenplay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          result=json.load(open("/tmp/response.json", encoding="utf-8"))
          script=result.get("script")
          if not isinstance(script,str) or len(script.strip()) < 300:
              raise SystemExit("Cannot build director request: accepted screenplay is missing.")
          payload={
            "mode":"director",
            "title":"The Five-Star Name Mix-Up",
            "duration":"short",
            "tone":"romcom",
            "language":"en",
            "script":script,
            "characterProfile":{
              "lunaName":"LUNA",
              "lunaLook":"Adult elegant European woman, long glossy chestnut-brown hair, hazel eyes, realistic natural features.",
              "lunaPersonality":"Warm, witty, romantic and playful.",
              "leoName":"LEO",
              "leoLook":"Adult elegant European man, neatly styled dark-brown hair, warm brown eyes, subtle stubble.",
              "leoPersonality":"Charming, affectionate and adorably chaotic.",
              "style":"Photorealistic luxury European lifestyle, natural cinematic lighting, realistic skin texture, vertical 9:16."
            }
          }
          json.dump(payload,open("/tmp/director-request.json","w"),ensure_ascii=False)
          PY
          echo "Requesting a real multi-shot director plan..."
          curl --silent --show-error --max-time 150 \
            -H "Origin: https://madahisaeid200-glitch.github.io" \
            -H "Content-Type: text/plain;charset=UTF-8" \
            --data-binary @/tmp/director-request.json \
            "https://orange-firefly-6434.madahisaeid200.workers.dev/" -o /tmp/director-response.json -w 'Director HTTP %{http_code}; total_seconds=%{time_total}; bytes=%{size_download}\\n'
          python3 - <<'PY'
          import json,sys
          result=json.load(open("/tmp/director-response.json",encoding="utf-8"))
          plan=result.get("plan") or {}
          shots=plan.get("shots") or []
          if result.get("ok") is not True or result.get("mode") != "director":
              print(json.dumps(result,ensure_ascii=False,indent=2)[:5000])
              raise SystemExit("FAIL: director-plan request did not return success.")
          if result.get("provider") == "local-template" or result.get("fallbackUsed") is True:
              print(json.dumps(result,ensure_ascii=False,indent=2)[:5000])
              raise SystemExit("FAIL: director plan used a deterministic fallback, not a live AI provider.")
          if plan.get("schemaVersion") != "luna-video-plan@1.0.0":
              raise SystemExit("FAIL: unexpected director-plan schema.")
          if not 4 <= len(shots) <= 10:
              raise SystemExit(f"FAIL: expected 4-10 short shots; received {len(shots)}.")
          for index,shot in enumerate(shots,1):
              if not isinstance(shot.get("videoPrompt"),str) or len(shot["videoPrompt"].strip()) < 30:
                  raise SystemExit(f"FAIL: shot {index} has no usable motion prompt.")
              if not isinstance(shot.get("referenceFramePrompt"),str) or len(shot["referenceFramePrompt"].strip()) < 30:
                  raise SystemExit(f"FAIL: shot {index} has no usable reference-frame prompt.")
              if any(name not in ("LUNA","LEO") for name in (shot.get("characters") or [])):
                  raise SystemExit(f"FAIL: shot {index} introduced an unapproved character.")
          print("PASS: director shot plan generated.")
          print("Provider:",result.get("provider"))
          print("Model:",result.get("model"))
          print("Shots:",len(shots))
          print("Duration seconds:",plan.get("episode",{}).get("targetDurationSeconds"))
          print("First shot:",shots[0].get("action","")[:180])
          PY
