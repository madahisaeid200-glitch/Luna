name: Diagnose LUNA Worker reachability

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/check-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check public Worker endpoint from GitHub runner
        shell: bash
        run: |
          echo "Checking public health endpoint from an independent network..."
          curl --verbose --max-time 25 --include --silent --show-error             "https://orange-firefly-6434.madahisaeid200.workers.dev/" || true
