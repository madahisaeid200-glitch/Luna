name: Diagnose LUNA Worker reachability and FLUX latency

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/check-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check GET, small POST, and 58 KB image POST from an independent network
        shell: bash
        run: |
          set -euo pipefail
          URL="https://orange-firefly-6434.madahisaeid200.workers.dev/"
          ORIGIN="https://madahisaeid200-glitch.github.io"

          echo "1/3 GET health check"
          curl --fail-with-body --silent --show-error --max-time 25 \
            -H "Origin: $ORIGIN" "$URL" -o /tmp/get.json -D /tmp/get.headers
          cat /tmp/get.json
          grep -qi "access-control-allow-origin: $ORIGIN" /tmp/get.headers

          echo "2/3 Small POST check"
          printf '%s' '{"mode":"ping"}' >/tmp/ping.json
          curl --fail-with-body --silent --show-error --max-time 25 \
            -H "Origin: $ORIGIN" -H "Content-Type: text/plain;charset=UTF-8" \
            --data-binary @/tmp/ping.json "$URL" -o /tmp/ping-response.json -D /tmp/ping.headers
          cat /tmp/ping-response.json
          python3 -c "import json; assert json.load(open('/tmp/ping-response.json')).get('ok') is True"

          echo "3/3 58 KB image-shaped POST check"
          python3 - <<'PY'
          import base64, json
          image = "data:image/jpeg;base64," + base64.b64encode(b"x" * 44000).decode("ascii")
          with open("/tmp/image-ping.json", "w") as f:
              json.dump({"mode": "image_ping", "image": image}, f, separators=(",", ":"))
          print("Request body bytes:", __import__("os").path.getsize("/tmp/image-ping.json"))
          PY
          curl --fail-with-body --silent --show-error --max-time 25 \
            -H "Origin: $ORIGIN" -H "Content-Type: text/plain;charset=UTF-8" \
            --data-binary @/tmp/image-ping.json "$URL" -o /tmp/image-response.json -D /tmp/image.headers
          cat /tmp/image-response.json
          python3 - <<'PY'
          import json
          result = json.load(open("/tmp/image-response.json"))
          assert result.get("ok") is True, result
          assert result.get("receivedImageChars", 0) > 50000, result
          print("PASS: Worker accepted the full image-shaped request.")
          PY
          grep -qi "access-control-allow-origin: $ORIGIN" /tmp/image.headers

          echo "4/4 Real FLUX image generation timing test (4 steps, after Worker deploy)"
          printf '%s' '{"mode":"image","script":"Photorealistic editorial photograph of an elegant adult couple in a luxury European hotel suite, natural skin texture, candid expressions, soft window light, realistic anatomy, vertical portrait."}' >/tmp/flux.json
          curl --fail-with-body --silent --show-error --max-time 180 \
            -H "Origin: $ORIGIN" -H "Content-Type: text/plain;charset=UTF-8" \
            --data-binary @/tmp/flux.json "$URL" -o /tmp/flux-response.json \
            -w 'HTTP %{http_code}; total_seconds=%{time_total}; bytes=%{size_download}\n'
          python3 - <<'PY'
          import json, os
          result = json.load(open('/tmp/flux-response.json'))
          assert isinstance(result.get('image'), str) and len(result['image']) > 10000, result
          print("PASS: FLUX generated an image.")
          print("Model:", result.get("model"), "steps:", result.get("steps"), "generationMs:", result.get("generationMs"))
          print("Image base64 characters:", len(result["image"]))
          PY

          echo "5/5 Real FLUX.2 Klein reference-image edit test"
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, io, json
          from PIL import Image
          image = Image.new("RGB", (384, 384), (178, 155, 132))
          pixels = image.load()
          for y in range(384):
              for x in range(384):
                  if (x // 48 + y // 48) % 2 == 0:
                      pixels[x, y] = (194, 176, 153)
          buffer = io.BytesIO()
          image.save(buffer, format="JPEG", quality=82, optimize=True)
          data = "data:image/jpeg;base64," + base64.b64encode(buffer.getvalue()).decode("ascii")
          body = {"mode":"image_edit","image":data,"prompt":"Transform this simple abstract color-block image into a polished photorealistic editorial photograph of an elegant luxury European hotel lobby, warm natural light, realistic materials, sophisticated composition. Preserve a square composition.","width":384,"height":384}
          with open("/tmp/flux-edit.json", "w") as f:
              json.dump(body, f, separators=(",", ":"))
          print("Reference image dimensions: 384x384; request bytes:", __import__("os").path.getsize("/tmp/flux-edit.json"))
          PY
          curl --fail-with-body --silent --show-error --max-time 150 \
            -H "Origin: $ORIGIN" -H "Content-Type: text/plain;charset=UTF-8" \
            --data-binary @/tmp/flux-edit.json "$URL" -o /tmp/flux-edit-response.json \
            -w 'HTTP %{http_code}; total_seconds=%{time_total}; bytes=%{size_download}\n'
          python3 - <<'PY'
          import json
          result = json.load(open("/tmp/flux-edit-response.json"))
          if not isinstance(result.get("image"), str) or len(result["image"]) < 10000:
              raise SystemExit("FAIL: FLUX.2 Klein edit did not return an image: " + json.dumps(result)[:1500])
          print("PASS: FLUX.2 Klein reference-image edit returned an image.")
          print("Model:", result.get("model"), "generationMs:", result.get("generationMs"))
          print("Output image base64 characters:", len(result["image"]))
          PY
