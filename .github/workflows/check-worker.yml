name: Diagnose LUNA Worker reachability and FLUX latency

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/check-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check GET, small POST, and 58 KB image POST from an independent network
        shell: bash
        run: |
          set -euo pipefail
          URL="https://orange-firefly-6434.madahisaeid200.workers.dev/"
          ORIGIN="https://madahisaeid200-glitch.github.io"

          echo "1/3 GET health check"
          curl --fail-with-body --silent --show-error --max-time 25 \
            -H "Origin: $ORIGIN" "$URL" -o /tmp/get.json -D /tmp/get.headers
          cat /tmp/get.json
          grep -qi "access-control-allow-origin: $ORIGIN" /tmp/get.headers

          echo "2/3 Small POST check"
          printf '%s' '{"mode":"ping"}' >/tmp/ping.json
          curl --fail-with-body --silent --show-error --max-time 25 \
            -H "Origin: $ORIGIN" -H "Content-Type: text/plain;charset=UTF-8" \
            --data-binary @/tmp/ping.json "$URL" -o /tmp/ping-response.json -D /tmp/ping.headers
          cat /tmp/ping-response.json
          python3 -c "import json; assert json.load(open('/tmp/ping-response.json')).get('ok') is True"

          echo "3/3 58 KB image-shaped POST check"
          python3 - <<'PY'
          import base64, json
          image = "data:image/jpeg;base64," + base64.b64encode(b"x" * 44000).decode("ascii")
          with open("/tmp/image-ping.json", "w") as f:
              json.dump({"mode": "image_ping", "image": image}, f, separators=(",", ":"))
          print("Request body bytes:", __import__("os").path.getsize("/tmp/image-ping.json"))
          PY
          curl --fail-with-body --silent --show-error --max-time 25 \
            -H "Origin: $ORIGIN" -H "Content-Type: text/plain;charset=UTF-8" \
            --data-binary @/tmp/image-ping.json "$URL" -o /tmp/image-response.json -D /tmp/image.headers
          cat /tmp/image-response.json
          python3 - <<'PY'
          import json
          result = json.load(open("/tmp/image-response.json"))
          assert result.get("ok") is True, result
          assert result.get("receivedImageChars", 0) > 50000, result
          print("PASS: Worker accepted the full image-shaped request.")
          PY
          grep -qi "access-control-allow-origin: $ORIGIN" /tmp/image.headers

          echo "4/4 Real FLUX image generation timing test (4 steps, after Worker deploy)"
          printf '%s' '{"mode":"image","script":"Photorealistic editorial photograph of an elegant adult couple in a luxury European hotel suite, natural skin texture, candid expressions, soft window light, realistic anatomy, vertical portrait."}' >/tmp/flux.json
          curl --fail-with-body --silent --show-error --max-time 180 \
            -H "Origin: $ORIGIN" -H "Content-Type: text/plain;charset=UTF-8" \
            --data-binary @/tmp/flux.json "$URL" -o /tmp/flux-response.json \
            -w 'HTTP %{http_code}; total_seconds=%{time_total}; bytes=%{size_download}\n'
          python3 - <<'PY'
          import json, os
          result = json.load(open('/tmp/flux-response.json'))
          assert isinstance(result.get('image'), str) and len(result['image']) > 10000, result
          print("PASS: FLUX generated an image.")
          print("Model:", result.get("model"), "steps:", result.get("steps"), "generationMs:", result.get("generationMs"))
          print("Image base64 characters:", len(result["image"]))
          PY

          echo "5/5 Real FLUX.2 Klein reference-image edit test"
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, io, json, os
          from PIL import Image
          generated = json.load(open("/tmp/flux-response.json"))
          raw = base64.b64decode(generated["image"])
          image = Image.open(io.BytesIO(raw)).convert("RGB")
          original_size = image.size
          scale = min(1.0, 480 / max(image.size))
          image = image.resize((max(1, round(image.width*scale)), max(1, round(image.height*scale))), Image.Resampling.LANCZOS)
          best = None
          for quality in range(5, 96):
              buffer = io.BytesIO()
              image.save(buffer, format="JPEG", quality=quality, optimize=True)
              data = "data:image/jpeg;base64," + base64.b64encode(buffer.getvalue()).decode("ascii")
              candidate = (abs(len(data)-40963), data, quality)
              if best is None or candidate[0] < best[0]:
                  best = candidate
          data, quality = best[1], best[2]
          ratio = image.width / image.height
          if ratio >= 1:
              width, height = 768, max(256, round((768/ratio)/64)*64)
          else:
              height, width = 768, max(256, round((768*ratio)/64)*64)
          body = {"mode":"image_edit","image":data,"prompt":"EDIT IMAGE 0. Keep the exact same adult couple, their facial identity, hair, outfits, expressions, camera angle, crop, furniture, props and luxury European hotel suite. Make only subtle photorealistic refinements to skin texture, hands and fabric. Do not create a new scene, add people, or change the composition.","width":width,"height":height}
          with open("/tmp/flux-edit.json", "w") as f:
              json.dump(body, f, separators=(",", ":"))
          print("Using actual FLUX-generated image:", original_size, "->", image.size, "image chars:", len(data), "JPEG quality:", quality, "request bytes:", os.path.getsize("/tmp/flux-edit.json"))
          assert 35000 <= len(data) <= 45000, "Reference payload is not close enough to the user's reported size"
          PY
          curl --silent --show-error --max-time 150 \
            -H "Origin: $ORIGIN" -H "Content-Type: text/plain;charset=UTF-8" \
            --data-binary @/tmp/flux-edit.json "$URL" -o /tmp/flux-edit-response.ndjson \
            -w 'HTTP %{http_code}; total_seconds=%{time_total}; bytes=%{size_download}\n'
          cat /tmp/flux-edit-response.ndjson
          python3 - <<'PY'
          import json
          events = [json.loads(line) for line in open("/tmp/flux-edit-response.ndjson") if line.strip()]
          stages = [e.get("stage") for e in events if e.get("type") == "progress"]
          print("Worker progress stages:", stages)
          result = next((e for e in events if e.get("type") == "complete"), None)
          errors = [e for e in events if e.get("type") == "error"]
          if result is None or not isinstance(result.get("image"), str) or len(result["image"]) < 10000:
              raise SystemExit("FAIL: NDJSON edit stream did not return an image: " + json.dumps(errors or events[-3:])[:1800])
          assert "worker_received" in stages, "Worker did not confirm receipt of the reference image"
          assert "model_started" in stages, "Worker did not confirm model invocation"
          print("PASS: streamed FLUX.2 Klein reference-image edit returned an image.")
          print("Model:", result.get("model"), "generationMs:", result.get("generationMs"), "attempts:", result.get("attempts"))
          print("Output image base64 characters:", len(result["image"]))
          PY

