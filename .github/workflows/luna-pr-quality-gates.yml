name: LUNA pull request quality gates

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["fix/episode-voice-sync-and-visual-qa"]

permissions:
  contents: read

jobs:
  static-and-qa-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse Worker JavaScript
        run: node --check worker.js
      - name: Parse producer scripts and test episode safeguards
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('producer.html', 'utf8');

          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1]).filter(source => source.trim());
          assert.ok(scripts.length >= 5, 'Expected the producer inline scripts to be present');
          scripts.forEach((source, index) => {
            try { new Function(source); }
            catch (error) { throw new Error('Inline script ' + (index + 1) + ' has a syntax error: ' + error.message); }
          });

          function extractFunction(name, signature) {
            const match = html.match(new RegExp('function ' + name + signature + '\\s*\\{[\\s\\S]*?\\n\\}'));
            assert.ok(match, 'Missing function: ' + name);
            return new Function(match[0] + '; return ' + name + ';')();
          }

          const extractDialogueForVoice = extractFunction('extractDialogueForVoice', '\\(script\\)');
          const validateLunaImageQa = extractFunction('validateLunaImageQa', '\\(analysis,requireTwo=false\\)');

          const dialogue = extractDialogueForVoice(
            'TITLE: Test\nLUNA: Why is the card wrong?\nLEO: I typed the surname incorrectly.\nNARRATOR: Unwanted voice\nLUNA: You did what?'
          );
          assert.match(dialogue, /^LUNA: Why is the card wrong\?/);
          assert.match(dialogue, /LEO: I typed the surname incorrectly\./);
          assert.match(dialogue, /LUNA: You did what\?/);
          assert.doesNotMatch(dialogue, /NARRATOR|TITLE/);

          const validTwoPersonQa = [
            'CAST CHECK: PASS',
            'VISIBLE PEOPLE: 2',
            'FACES IN ARTWORK: NO',
            'PHOTOREALISM: 8',
            'HANDS/ANATOMY: 7',
            'VISIBLE DEFECTS: none'
          ].join('\n');
          assert.equal(validateLunaImageQa(validTwoPersonQa, true).pass, true);
          assert.equal(validateLunaImageQa(validTwoPersonQa.replace('VISIBLE PEOPLE: 2', 'VISIBLE PEOPLE: 3'), false).pass, false);
          assert.equal(validateLunaImageQa(validTwoPersonQa.replace('FACES IN ARTWORK: NO', 'FACES IN ARTWORK: YES'), false).pass, false);
          assert.equal(validateLunaImageQa(validTwoPersonQa.replace('PHOTOREALISM: 8', 'PHOTOREALISM: 5'), false).pass, false);
          assert.equal(validateLunaImageQa(validTwoPersonQa.replace('HANDS/ANATOMY: 7', 'HANDS/ANATOMY: 4'), false).pass, false);
          const onePersonQa = validTwoPersonQa.replace('VISIBLE PEOPLE: 2', 'VISIBLE PEOPLE: 1');
          assert.equal(validateLunaImageQa(onePersonQa, false).pass, true);
          assert.equal(validateLunaImageQa(onePersonQa, true).pass, false);

          assert.doesNotMatch(html, /el\('makePreviewVideo'\)\.disabled\s*=\s*false/,
            'Wan video must never be enabled before a passing visual QA result');
          const videoHandler = html.match(/el\('makePreviewVideo'\)\.onclick\s*=\s*async\(\)=>\s*\{([\s\S]*?)\n\s*\};/);
          assert.ok(videoHandler, 'Missing Wan video handler');
          assert.match(videoHandler[1], /if\(!firstSceneQaPassed\)/,
            'Wan video handler must enforce the first-scene QA flag');
          const restoreStart = html.indexOf('async function restoreLatestLunaImage');
          const restoreEnd = html.indexOf('function reportLunaDiagnostic', restoreStart);
          assert.ok(restoreStart >= 0 && restoreEnd > restoreStart, 'Missing image restore routine');
          const restore = html.slice(restoreStart, restoreEnd);
          assert.match(restore, /firstSceneQaPassed=false/);
          assert.match(restore, /el\('makePreviewVideo'\)\.disabled=true/);
          assert.match(html, /const qa=validateLunaImageQa\(analysis,true\)/,
            'First scene QA must require both LUNA and LEO');

          assert.match(html, /const sceneQaResult=validateLunaImageQa\(sceneQa\.analysis,true\)/,
            'Every generated story scene must pass two-person visual QA');
          const autoStart = html.indexOf("el('autoProduce').onclick=async()=>");
          assert.ok(autoStart >= 0, 'Missing automatic production handler');
          const autoHandler = html.slice(autoStart);
          assert.match(autoHandler, /if\(!firstSceneQaPassed&&generatedImageData\)/,
            'One-click production must automatically re-run visual QA for a restored image');
          assert.match(autoHandler, /analyzeButton\.click\(\)/,
            'Restored image QA must not require a manual user click');
          assert.match(autoHandler, /کنترل کیفیت تصویر بازیابی‌شده/,
            'Restored image QA must have a bounded wait stage');
          for (const stage of ['generateMoreScenes','generateVoice','generateWanClips','assembleWanClips']) {
            assert.ok(autoHandler.includes("runAutoStage('" + stage + "'"),
              'Automatic production must run the complete stage: ' + stage);
          }
          assert.match(autoHandler, /generatedWanClipUrls\.length===3/,
            'Automatic production must wait for all three Wan clips');
          assert.match(autoHandler, /assembledWanVideoUrl/,
            'Automatic production must wait for the final stitched film');
          assert.match(autoHandler, /if\(!lastDraft&&!quotaBlocked\)/,
            'A valid Worker-provided local-template screenplay must not be rejected just because it is not AI-generated');
          assert.match(autoHandler, /if\(!lastDraft\)\{[\s\S]*lastDraft=draft\(/,
            'Browser-side fallback screenplay may only be synthesized when no valid Worker screenplay exists');
          assert.match(autoHandler, /Worker یک سناریوی جایگزین محلی برگرداند/,
            'Local-template fallback must be clearly labelled as non-AI output');
          const clearMediaStart = html.indexOf('function clearCurrentEpisodeMedia()');
          const clearMediaEnd = html.indexOf('const lunaDiagnostics', clearMediaStart);
          assert.ok(clearMediaStart >= 0 && clearMediaEnd > clearMediaStart, 'Missing episode media reset routine');
          const clearMedia = html.slice(clearMediaStart, clearMediaEnd);
          assert.match(clearMedia, /assembledWanVideoUrl=''/,
            'Starting a new episode must invalidate the previous assembled video URL');
          assert.ok(clearMedia.includes("el('assembledWanPreview')") && clearMedia.includes("assembled.removeAttribute('src')"),
            'Starting a new episode must clear the previous assembled video preview');
          assert.ok(clearMedia.includes("el('downloadAssembledWan')") && clearMedia.includes("assembledLink.removeAttribute('href')"),
            'Starting a new episode must clear the previous assembled download link');
          assert.ok(clearMedia.includes("el('voicePreview')") && clearMedia.includes("audio.removeAttribute('src')"),
            'Starting a new episode must clear the previous voice recording');
          assert.ok(clearMedia.includes("el('wanClipList')") && clearMedia.includes("clipList.replaceChildren()"),
            'Starting a new episode must clear stale Wan clip cards');
          const voicedStart = html.indexOf("el('makeVoicedVideo').onclick=async()=>");
          const voicedEnd = html.indexOf("el('generateVoice').onclick=async()=>", voicedStart);
          assert.ok(voicedStart >= 0 && voicedEnd > voicedStart, 'Missing voiced animatic handler');
          const voicedHandler = html.slice(voicedStart, voicedEnd);
          assert.match(voicedHandler, /captionWeights/,
            'Dialogue captions must use weighted durations rather than equal time slices');
          assert.match(voicedHandler, /captionEnds\.findIndex/,
            'Caption selection must follow cumulative weighted timing');
          assert.match(voicedHandler, /caption\.replace\(\/\^\(LUNA\|LEO\|LUNA & LEO\)\\s\*:/,
            'Speaker labels must be stripped from rendered captions');
          assert.match(voicedHandler, /audio\.readyState<1/,
            'Audio metadata must be ready before reading its duration');
          assert.match(voicedHandler, /if\(!duration\)/,
            'Animatic must reject unknown audio duration rather than silently assume 30 seconds');
          const stitchStart = html.indexOf("el('assembleWanClips').onclick=async()=>");
          const stitchEnd = html.indexOf("el('makeVoicedVideo').onclick=async()=>", stitchStart);
          assert.ok(stitchStart >= 0 && stitchEnd > stitchStart, 'Missing real Wan clip assembly handler');
          const stitchHandler = html.slice(stitchStart, stitchEnd);
          assert.match(stitchHandler, /while\(hasVoice\?!audioEnded:clipIndex<videos\.length\)/,
            'Real Wan clips must continue cycling until the voice track ends');
          assert.match(stitchHandler, /audio\.onended=\(\)=>\{audioEnded=true;\}/,
            'Wan clip cycling must stop on the actual voice-track ended event');
          assert.match(stitchHandler, /clipIndex=\(clipIndex\+1\)%videos\.length/,
            'Wan clips must cycle in story order instead of freezing on the final frame');
          const generationStart = html.indexOf("el('generateSceneImage').onclick=async()=>");
          const generationEnd = html.indexOf("el('generateMoreScenes').onclick=async()=>", generationStart);
          assert.ok(generationStart >= 0 && generationEnd > generationStart, 'Missing first-scene generation handler');
          const generationHandler = html.slice(generationStart, generationEnd);
          assert.match(generationHandler, /generatedWanClipUrls\.forEach\(url=>URL\.revokeObjectURL\(url\)\)/,
            'Regenerating the first image must revoke stale Wan clips');
          assert.match(generationHandler, /generatedWanClipUrls=\[\]/,
            'Regenerating the first image must clear old Wan clip references');
          assert.match(generationHandler, /assembledWanVideoUrl=''/,
            'Regenerating the first image must invalidate the assembled film');
          assert.match(generationHandler, /downloadAssembledWan/,
            'Regenerating the first image must clear the old assembled download link');
          assert.match(generationHandler, /oldAssembled\.removeAttribute\('src'\)/,
            'Regenerating the first image must clear the old assembled preview');
          assert.match(generationHandler, /makeVoicedVideo/,
            'Regenerating the first image must not leave stale voice-video state available');
          const editStart = html.indexOf("el('editSceneImage').onclick=async()=>");
          const editEnd = html.indexOf("el('downloadSceneImage').onclick=", editStart);
          assert.ok(editStart >= 0 && editEnd > editStart, 'Missing image-edit handler');
          const editHandler = html.slice(editStart, editEnd);
          assert.match(editHandler, /firstSceneQaPassed=false/,
            'Editing the first image must invalidate its previous approval');
          assert.match(editHandler, /qaPassed:false/,
            'Edited first image must start unapproved');
          assert.ok(editHandler.includes('validateLunaImageQa(editedQa.analysis,true)'),
            'Edited first image must pass fresh two-person visual QA');
          for (const id of ['generateMoreScenes','generateWanClips','makePreviewVideo','makeVoicedVideo','assembleWanClips']) {
            assert.ok(editHandler.includes("'" + id + "'"),
              'Editing the first image must lock downstream action: ' + id);
          }
          console.log('INLINE_SCRIPT_SYNTAX: PASS (' + scripts.length + ' scripts)');
          console.log('SCREENPLAY_TO_VOICE_SYNC: PASS');
          console.log('VISUAL_QA_PARSER: PASS (valid, third person, artwork, realism, anatomy, close-up cases)');
          console.log('WAN_PRE_QA_LOCK: PASS (new image, edited image, and restored image paths)');
          NODE
