name: Deploy LUNA to Cloudflare Pages

on:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Temporary safety guard: this feature branch must never deploy to production.
      # PR17 owns the canonical regression test for the production-main guard.
      - name: Refuse non-main deployment
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deployment is only allowed from the main branch."
          exit 1

      - name: Prepare Cloudflare Pages bundle
        run: |
          mkdir -p dist
          cp index.html producer.html _worker.js dist/
          cp reels.html media-lab.html dist/
          if [ -d assets ]; then cp -a assets dist/; fi
          if [ -d images ]; then cp -a images dist/; fi
          if [ -d styles ]; then cp -a styles dist/; fi
          if [ -d scripts ]; then cp -a scripts dist/; fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create Pages project if needed and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9a81ca3d49ea435cdf36b10f6aca35aa
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx --yes wrangler@4 pages project create luna-studio --production-branch main || true
          npx --yes wrangler@4 pages deploy dist --project-name=luna-studio --branch=main
