name: LUNA keyless TTS provider probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/luna-tts-ai-probe.yml
      - worker.js
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe anonymous Kokoro TTS, multi-chunk MP3 and decode
        env:
          API: https://api.tts.ai
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function speak(text, voice) {
            const r = await fetch(process.env.API + '/v1/tts/', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({model:'kokoro',text,voice,format:'mp3',language:'en'})});
            const raw=await r.text();
            if(!r.ok) throw new Error('submit HTTP '+r.status+': '+raw.slice(0,500));
            const job=JSON.parse(raw);
            for(let i=0;i<45;i++){
              await sleep(1500);
              const p=await fetch(process.env.API+'/v1/speech/results/?uuid='+encodeURIComponent(job.uuid));
              const pr=await p.text();
              if(!p.ok)throw new Error('poll HTTP '+p.status+': '+pr.slice(0,400));
              const result=JSON.parse(pr);
              if(result.status==='failed')throw new Error('job failed: '+JSON.stringify(result).slice(0,500));
              if(result.status==='completed'&&result.result_url){
                const a=await fetch(result.result_url);const bytes=Buffer.from(await a.arrayBuffer());
                if(!a.ok||bytes.length<1000)throw new Error('invalid audio download');
                return bytes;
              }
            }
            throw new Error('job timeout');
          }
          (async()=>{
            const vr=await fetch(process.env.API+'/v1/voices/?model=kokoro&language=en&gender=female');
            if(!vr.ok)throw new Error('voices HTTP '+vr.status);
            const voices=(await vr.json()).voices||[];
            const voice=voices.find(v=>v.id==='af_bella')||voices[0];
            if(!voice?.id)throw new Error('no English female voice');
            console.log('VOICE:',voice.id);
            const parts=[
              'Hello. Welcome to LUNA and LEO. Our little luxury adventure is just beginning.',
              'Tonight, a romantic surprise is waiting in a beautiful hotel suite. But one tiny booking mistake is about to turn everything upside down.'
            ];
            const audio=[];
            for(let i=0;i<parts.length;i++){if(parts[i].length>500)throw new Error('test chunk too long');const b=await speak(parts[i],voice.id);audio.push(b);console.log('CHUNK',i+1,'BYTES',b.length,'HEADER',b.subarray(0,3).toString());}
            const joined=Buffer.concat(audio);
            fs.writeFileSync('luna-tts-multichunk.mp3',joined);
            fs.writeFileSync('luna-tts-multichunk.json',JSON.stringify({provider:'tts.ai',model:'kokoro',voice:voice.id,chunks:audio.length,bytes:joined.length},null,2));
            console.log('MULTICHUNK_MP3_BYTES:',joined.length);
            console.log('MULTICHUNK_TTS_PROBE: PASS');
          })().catch(e=>{console.error('MULTICHUNK_TTS_PROBE: FAIL',e);process.exit(1);});
          NODE
      - name: Decode concatenated MP3
        run: |
          ffmpeg -v error -i luna-tts-multichunk.mp3 -f null -
          echo "FFMPEG_DECODE: PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luna-keyless-tts-multichunk
          path: luna-tts-multichunk.*
          if-no-files-found: ignore
          retention-days: 7
